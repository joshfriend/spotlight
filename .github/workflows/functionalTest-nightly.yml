name: "Functional Tests (Gradle Nightly)"

on:
  schedule:
    # Every day at 08:00 UTC (4am EDT / 3am EST)
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  functionalTest-nightly:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Fetch Gradle nightly version
      id: nightly
      run: |
        version=$(curl -sSf https://services.gradle.org/versions/nightly | jq -r '.version')
        if [[ -z "$version" || "$version" == "null" ]]; then
          echo "No nightly version available" >&2
          exit 1
        fi
        echo "Gradle nightly version: $version"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Functional Tests
      run: ./gradlew functionalTest -DgradleVersion=${{ steps.nightly.outputs.version }}
