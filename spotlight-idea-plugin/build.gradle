import org.jetbrains.intellij.platform.gradle.IntelliJPlatformType
import org.jetbrains.intellij.platform.gradle.TestFrameworkType

plugins {
  id 'conventions.ij-plugin'
}

def intellijTarget = "2026.2.0.1"

dependencies {
  implementation project(":buildscript-utils")

  intellijPlatform {
    intellijIdea(intellijTarget) {
      // Use cache to prevent multiple IDE transforms when build classpath changes
      useCache = true
    }

    bundledPlugin("com.intellij.gradle")
    bundledModule("com.intellij.modules.json")

    testFramework(TestFrameworkType.Platform.INSTANCE)
    // Needed so build.gradle/build.gradle.kts fixtures parse as Groovy/Kotlin in completion tests
    testBundledPlugin("org.intellij.groovy")
    testBundledPlugin("org.jetbrains.kotlin")
    // Needed so spotlight-rules.json fixtures parse as JSON and load the optional plugin descriptor
    testBundledModule("com.intellij.modules.json")

    intellijPlatformTesting.runIde.register("runLocalIde") {
      // https://plugins.jetbrains.com/docs/intellij/android-studio.html#configuring-the-plugin-gradle-build-script
      def path = providers.gradleProperty("intellijPlatformTesting.idePath").getOrNull()
      if (path != null) {
        localPath.set(file(it))
      }
    }
  }
}

intellijPlatformTesting.runIde.configureEach {
  plugins {
    // This throws a bunch of errors in the IDE
    disablePlugin("com.intellij.kubernetes")
  }
}

// https://plugins.jetbrains.com/docs/intellij/tools-intellij-platform-gradle-plugin-extension.html
intellijPlatform {
  pluginConfiguration {
    name = "Spotlight"
  }

  pluginVerification {
    ides {
      create(
        IntelliJPlatformType.IntellijIdea,
        intellijTarget
      )
    }
  }
}
